<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grid Lock" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Grid Lock</title>
  </head>
  <body>
    <div id="sky"><i></i><i></i><i></i></div>

    <div id="play" class="hidden">
      <div id="hud">
        <button id="back" class="round" aria-label="Levels">‹</button>
        <div class="lvl"><small id="tier"></small><span id="level"></span></div>
        <div class="count"><small>MOVES</small><span id="moves">0</span></div>
        <div class="count par"><small>PAR</small><span id="par"></span></div>
      </div>
      <div id="wrap"><div id="board"><div id="exit"><b>›</b><b>›</b></div><div id="ghost"></div></div></div>
      <div id="tools">
        <button id="undo" class="tool"><b>↶</b>Undo</button>
        <button id="again" class="tool"><b>⟲</b>Restart</button>
        <button id="hint" class="tool"><b>✦</b>Hint</button>
      </div>
    </div>

    <div id="menu" class="screen">
      <h1><span>GRID</span><span>LOCK</span></h1>
      <p class="tag">Clear the jam. Get the gold car out.</p>
      <button id="go" class="big">PLAY</button>
      <button id="open-levels" class="big alt">LEVELS</button>
      <div id="stats"></div>
      <p class="help">Drag vehicles along their lane. Slide the <b>gold car</b> out through the gate. Any slide of one vehicle counts as one move.</p>
      <div id="cloud">
        <small>☁ CLOUD SAVE ID</small>
        <div class="idrow"><code id="cloud-id"></code><button id="cloud-copy" class="chip">Copy</button></div>
        <span id="cloud-status"></span>
        <button id="cloud-restore" class="link">Restore a save from another device</button>
      </div>
      <div class="row">
        <button id="sound" class="chip"></button>
        <button id="wipe" class="chip">Reset progress</button>
      </div>
      <div id="version"><span id="version-text"></span><button id="refresh" class="chip">↻ Check for update</button></div>
    </div>

    <div id="levels" class="screen hidden scroll">
      <div class="topbar"><button id="levels-back" class="chip">← Menu</button><span id="levels-stars"></span></div>
      <div id="tiers"></div>
    </div>

    <div id="result" class="screen hidden">
      <div id="burst"></div>
      <h2>CLEAR!</h2>
      <div id="r-stars"></div>
      <div id="r-text"></div>
      <button id="r-next" class="big">NEXT</button>
      <div class="row"><button id="r-again" class="chip">Replay</button><button id="r-levels" class="chip">Levels</button></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
